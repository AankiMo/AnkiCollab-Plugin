[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .venv __pycache__ crowd_anki ui
asyncio_mode = auto
markers =
    integration: tests requiring a real Anki session (pytest-anki)
    performance: performance benchmark tests
    slow: slow running tests
addopts = -v --tb=short --import-mode=importlib
